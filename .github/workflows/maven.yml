---
# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain
        uses: jdx/mise-action@v5
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.npm
          key: ${{ runner.os }}-dependencies-${{ hashFiles('pom.xml', '.mvn/**', 'src/main/webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dependencies-
      - name: Install frontend dependencies
        working-directory: src/main/webui
        run: npm ci
      - name: Lint frontend
        working-directory: src/main/webui
        run: npm run biome:check
      - name: Build frontend
        working-directory: src/main/webui
        run: npm run build
      - name: Build with Maven
        run: ./mvnw -B clean package
      - name: Show dependencies
        run: |
          ./mvnw -B dependency:list
          ./mvnw -B dependency:tree
          ./mvnw -B dependency:resolve-plugins
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@v6
